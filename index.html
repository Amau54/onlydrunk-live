    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="mobile-web-app-capable" content="yes"/>

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; media-src 'self' data: https:; frame-src https://www.youtube-nocookie.com https://open.spotify.com https://widget.deezer.com; connect-src 'self' https:; manifest-src 'self';"/>
    <link rel="manifest" href="./manifest.webmanifest"/>
    <link rel="icon" href="./logo.png" type="image/png"/>
    <link rel="apple-touch-icon" href="./logo.png"/>
    <title>Only Drunk — Jeu de soirée 18+</title>
    <!-- Composant pré-React : chargé immédiatement depuis les assets locaux de
         l'APK, sans attendre le bundle principal ni une bibliothèque externe. -->
    <script src="./beer-spinner.js"></script>
    <script type="module" crossorigin src="/onlydrunk-live/assets/index-XkSK0rYj.js"></script>
    <link rel="modulepreload" crossorigin href="/onlydrunk-live/assets/vendor-react-QXrNKzY_.js">
    <link rel="modulepreload" crossorigin href="/onlydrunk-live/assets/i18n-BWRwV3v0.js">
    <link rel="modulepreload" crossorigin href="/onlydrunk-live/assets/games-data-Nkav3eHL.js">
    <link rel="modulepreload" crossorigin href="/onlydrunk-live/assets/vendor-DJ1mgiBU.js">
    <link rel="modulepreload" crossorigin href="/onlydrunk-live/assets/app-main-DYH-fnor.js">
    <link rel="stylesheet" crossorigin href="/onlydrunk-live/assets/app-main-Dg8V7C5u.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- Boot-loader HORS de #root : le logo et le nom restent visibles pendant
         le démarrage, puis React dissout et retire l'ensemble après son rendu. -->
    <div id="boot-loader" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#09080f;color:#ede4cc;font-family:system-ui,sans-serif;text-align:center;padding:20px;transition:opacity .4s ease;will-change:opacity;">
      <img src="./logo-mark.png" alt="" aria-hidden="true" width="96" height="96" style="width:96px;height:96px;object-fit:contain;margin-bottom:14px;filter:drop-shadow(0 4px 16px rgba(245,150,26,.45));"/>
      <div style="font-size:18px;font-weight:700;color:#c8943a;margin-bottom:12px;">OnlyDrunk</div>
      <beer-spinner role="status" aria-live="polite" aria-label="Chargement de OnlyDrunk" size="90" speed="1.7" amber="#f5961a" foam="0.62" glow="0.58"></beer-spinner>
      <div id="boot-error" style="margin-top:24px;font-size:11px;color:#f87171;max-width:300px;display:none;white-space:pre-wrap;text-align:left;"></div>
    </div>
    <noscript>Cette application nécessite JavaScript pour fonctionner.</noscript>
    <script>
      // Capture les erreurs JS très précoces (avant React mount) pour debug APK.
      // Si l'app n'a pas mounté après 8s, on affiche un message lisible.
      window.addEventListener('error', function(e) {
        var el = document.getElementById('boot-error');
        if (el) {
          el.style.display = 'block';
          el.textContent = '⚠️ Erreur de chargement : ' + (e?.message || e?.error?.message || 'inconnue');
        }
      });
      setTimeout(function() {
        var loader = document.getElementById('boot-loader');
        // Si le loader est encore visible à 8s, c'est que React n'a pas mounté
        if (loader && loader.parentNode) {
          var err = document.getElementById('boot-error');
          if (err && !err.textContent) {
            err.style.display = 'block';
            err.textContent = '⚠️ L\'app n\'a pas démarré. Recharge l\'application ou réinstalle l\'APK.';
          }
        }
      }, 8000);
    </script>
  </body>
</html>
